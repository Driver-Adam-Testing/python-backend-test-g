name: Backend Staging Deployment
on:
  push:
    branches: ["staging"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deployment repo workflow
        run: |
          set -e

          # Make the request and capture HTTP status code
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEP_REPO_WORKFLOW_DISPATH_TOKEN }}" \
            https://api.github.com/repos/driver-ai/deployment/actions/workflows/develop.yaml/dispatches \
            -d '{"ref":"develop"}')

          echo "HTTP status: $STATUS"

          # Expect 204 No Content
          if [ "$STATUS" -ne 204 ]; then
            echo "❌ Failed to trigger workflow. Expected 204 but got $STATUS"
            exit 1
          fi

          echo "✅ Successfully triggered workflow."
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Install dependencies without virtualenv
        run: poetry install --no-root
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_CICD_ROLE }}
      
      - name: Deploy Inspector
        working-directory: content_services/inspector
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENV: ${{ vars.MODAL_ENV }}
        run: poetry install --no-root && poetry run modal deploy --env=$MODAL_ENV --tag=${GITHUB_SHA::8} src/main.py
      - name: Deploy PDF Preprocessing
        working-directory: content_services/pdf_preprocessing
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENV: ${{ vars.MODAL_ENV }}
        run: poetry install --no-root && poetry run modal deploy --env=$MODAL_ENV --tag=${GITHUB_SHA::8} src/main.py
      - name: Deploy Agent
        working-directory: content_services/agent
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENV: ${{ vars.MODAL_ENV }}
        run: poetry install --no-root && poetry run modal deploy --env=$MODAL_ENV --tag=${GITHUB_SHA::8} src/main.py
      - name: Deploy Mermaid Validator
        working-directory: content_services/mermaid_validator
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENV: ${{ vars.MODAL_ENV }}
        run: poetry install --no-root && poetry run modal deploy --env=$MODAL_ENV --tag=${GITHUB_SHA::8} src/main.py
      - name: Deploy Autodocs
        working-directory: content_services/autodocs
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENV: ${{ vars.MODAL_ENV }}
        run: poetry install --no-root && poetry run modal deploy --env=$MODAL_ENV --tag=${GITHUB_SHA::8} src/main.py
      - name: Deploy Generation
        working-directory: content_services/generation
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENV: ${{ vars.MODAL_ENV }}
        run: poetry install --no-root && poetry run modal deploy --env=$MODAL_ENV --tag=${GITHUB_SHA::8} src/main.py
      - name: Deploy Auth0 Sync
        working-directory: content_services/auth0_sync
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENV: ${{ vars.MODAL_ENV }}
        run: poetry install --no-root && poetry run modal deploy --env=$MODAL_ENV --tag=${GITHUB_SHA::8} src/modal_main.py
