name: Dependabot Auto Update
# Updates downstream packages when dependabot updates one
permissions:
  id-token: write # TODO see if this is needed
  contents: write
on:
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

jobs:
  update_lock_files:
    if: ${{ github.actor == 'dependabot[bot]' || github.actor == 'dependabot-preview[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install Required Python Packages
        run: |
          pip install toml

      - name: Update Interdependent Packages
        run: |
          python update_interdependent_packages.py

      - name: Commit and Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update interdependent packages and lock files" || exit 0
          git push origin ${{ github.head_ref }}
